<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet"
          integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
          crossorigin="anonymous">
</head>
<body style="background-color: #f8f9fa;">
<div class="container">
    <div class="p-4 bg-white rounded-3 shadow" style="max-width: 500px; margin: 50px auto;">
        <h1 class="text-center mb-4" style="color: #3f51b5;">Dashboard</h1>
        <div id="greeting" class="text-center mb-4"></div>
        <button id="logout-btn" class="btn btn-secondary w-100 py-2">Logout</button>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
        crossorigin="anonymous"></script>
<script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>

<script>
    $(document).ready(function() {

        // Function to get cookie by name
        function getCookie(name) {
            const value = `; ${document.cookie}`;
            const parts = value.split(`; ${name}=`);
            if (parts.length === 2) return parts.pop().split(';').shift();
            return null;
        }

        // Get token and username from cookies
        const token = getCookie('jwtToken');
        const username = getCookie('username');

        if (!token || !username) {
            alert('Please sign in first.');
            window.location.href = 'signin.html';
            return;
        }

        // Function to make authenticated request
        function makeAuthenticatedRequest(url) {
            $.ajax({
                method: 'GET',
                url: url,
                headers: {
                    'Authorization': 'Bearer ' + token
                },
                success: function(response) {
                    $('#greeting').text(response);
                },
                error: function(xhr) {
                    const errorMsg = xhr.responseJSON ? xhr.responseJSON.data : 'Failed to load content.';
                    alert(errorMsg);
                    // Clear cookies and redirect to sign-in on error
                    document.cookie = 'jwtToken=; path=/; max-age=0';
                    document.cookie = 'username=; path=/; max-age=0';
                    window.location.href = 'signin.html';
                }
            });
        }

        // Determine endpoint based on role (try both endpoints to determine role)
        makeAuthenticatedRequest('http://localhost:9090/hello/admin');
        // If admin fails, it will trigger error and redirect, or we can try user endpoint
        setTimeout(() => {
            if ($('#greeting').text() === '') {
                makeAuthenticatedRequest('http://localhost:9090/hello/user');
            }
        }, 500);

        // Logout functionality
        $('#logout-btn').on('click', function() {
            // Clear cookies
            document.cookie = 'jwtToken=; path=/; max-age=0';
            document.cookie = 'username=; path=/; max-age=0';
            alert('Logged out successfully.');
            window.location.href = 'signin.html';
        });
    });
</script>

</body>
</html>
